name: Deploy Light Color to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout canonical static site
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Create deployment artifact
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          mkdir _site

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            ./ _site/

          python3 <<'PY'
          import os
          from pathlib import Path

          root = Path("_site")
          base = os.environ["BASE_PATH"].rstrip("/")

          if not base:
              print("Pages is hosted at domain root; no path transformation required.")
              raise SystemExit(0)

          extensions = {
              ".html", ".css", ".js", ".json",
              ".xml", ".xsl", ".svg"
          }

          replacements = {
              '"/wp-content/': f'"{base}/wp-content/',
              "'/wp-content/": f"'{base}/wp-content/",
              '"/wp-includes/': f'"{base}/wp-includes/',
              "'/wp-includes/": f"'{base}/wp-includes/",
              'url(/wp-content/': f'url({base}/wp-content/',
              'url("/wp-content/': f'url("{base}/wp-content/',
              "url('/wp-content/": f"url('{base}/wp-content/",
              'url(/wp-includes/': f'url({base}/wp-includes/',
              'url("/wp-includes/': f'url("{base}/wp-includes/',
              "url('/wp-includes/": f"url('{base}/wp-includes/",
          }

          changed = []

          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue

              try:
                  original = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue

              updated = original
              for old, new in replacements.items():
                  updated = updated.replace(old, new)

              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          print(f"Pages base path: {base}")
          print(f"Files adapted: {len(changed)}")
          for path in changed:
              print(f"  {path}")
          PY

      - name: Verify deployment artifact
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          test -f _site/index.html
          test -d _site/wp-content
          test -d _site/wp-includes

          echo "Artifact structure OK"
          echo "GitHub Pages base path: $BASE_PATH"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
