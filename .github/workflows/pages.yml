name: Deploy Light Color to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build GitHub Pages artifact
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Checkout canonical source
      # ------------------------------------------------------------
      - name: Checkout canonical static site
        uses: actions/checkout@v6

      # ------------------------------------------------------------
      # 2. Configure GitHub Pages
      # ------------------------------------------------------------
      # Provides the deployment base path dynamically.
      #
      # Current project deployment:
      #   /light-color-web
      #
      # A future domain-root deployment may use:
      #   /
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      # ------------------------------------------------------------
      # 3. Build ephemeral deployment artifact
      # ------------------------------------------------------------
      # The canonical repository remains unchanged.
      # GitHub Pages-specific transformations are applied only
      # to the temporary _site/ directory.
      - name: Create deployment artifact
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail

          mkdir _site

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            ./ _site/

          python3 <<'PY'
          import os
          from pathlib import Path

          root = Path("_site")
          base = os.environ["BASE_PATH"].rstrip("/")

          if not base:
              print(
                  "Pages is hosted at domain root; "
                  "no path transformation required."
              )
              raise SystemExit(0)

          extensions = {
              ".html",
              ".css",
              ".js",
              ".json",
              ".xml",
              ".xsl",
              ".svg",
          }

          replacements = {
              # Quoted asset URLs
              '"/wp-content/':
                  f'"{base}/wp-content/',
              "'/wp-content/":
                  f"'{base}/wp-content/",
              '"/wp-includes/':
                  f'"{base}/wp-includes/',
              "'/wp-includes/":
                  f"'{base}/wp-includes/",

              # Responsive srcset candidates after commas
              ', /wp-content/':
                  f', {base}/wp-content/',
              ', /wp-includes/':
                  f', {base}/wp-includes/',

              # CSS url(...) references
              'url(/wp-content/':
                  f'url({base}/wp-content/',
              'url("/wp-content/':
                  f'url("{base}/wp-content/',
              "url('/wp-content/":
                  f"url('{base}/wp-content/",

              'url(/wp-includes/':
                  f'url({base}/wp-includes/',
              'url("/wp-includes/':
                  f'url("{base}/wp-includes/',
              "url('/wp-includes/":
                  f"url('{base}/wp-includes/",
          }

          changed = []

          for path in root.rglob("*"):
              if (
                  not path.is_file()
                  or path.suffix.lower() not in extensions
              ):
                  continue

              try:
                  original = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue

              updated = original

              for old, new in replacements.items():
                  updated = updated.replace(old, new)

              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          print(f"Pages base path: {base}")
          print(f"Files adapted: {len(changed)}")

          for path in changed:
              print(f"  {path}")
          PY

      # ------------------------------------------------------------
      # 4. Verify deployment artifact
      # ------------------------------------------------------------
      # The build fails before upload if:
      #
      # - the required static structure is missing; or
      # - browser-runtime asset URLs still point to /wp-content/
      #   or /wp-includes/ at the host root.
      #
      # Correctly transformed URLs under BASE_PATH are masked before
      # inspection so they cannot produce false positives.
      - name: Verify deployment artifact
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail

          test -f _site/index.html
          test -d _site/wp-content
          test -d _site/wp-includes

          echo "Artifact structure OK"
          echo "GitHub Pages base path: $BASE_PATH"

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path("_site")
          base = os.environ["BASE_PATH"].rstrip("/")

          if not base:
              print(
                  "Domain-root deployment: "
                  "root-relative WordPress paths are valid."
              )
              raise SystemExit(0)

          extensions = {
              ".html",
              ".css",
              ".js",
              ".json",
              ".xml",
              ".xsl",
              ".svg",
          }

          # --------------------------------------------------------
          # Runtime path audit
          # --------------------------------------------------------
          #
          # VALID:
          #
          #   /light-color-web/wp-content/...
          #   /light-color-web/wp-includes/...
          #
          # INVALID:
          #
          #   /wp-content/...
          #   /wp-includes/...
          #
          # Valid BASE_PATH-prefixed references are masked before
          # inspection. This prevents a valid path such as:
          #
          #   /light-color-web/wp-content/
          #
          # from being mistaken for:
          #
          #   /wp-content/
          #
          # Only browser-runtime URL contexts are inspected.
          # Comments and sourceURL/debug references are intentionally
          # ignored.

          runtime_patterns = [
              # HTML runtime attributes
              re.compile(
                  r'''(?:src|href|poster)\s*=\s*["']/'''
                  r'''(?:wp-content|wp-includes)/''',
                  re.IGNORECASE,
              ),

              # Responsive image srcset
              re.compile(
                  r'''srcset\s*=\s*["'][^"']*/'''
                  r'''(?:wp-content|wp-includes)/''',
                  re.IGNORECASE,
              ),

              # CSS url(...)
              re.compile(
                  r'''url\(\s*["']?/'''
                  r'''(?:wp-content|wp-includes)/''',
                  re.IGNORECASE,
              ),
          ]

          valid_prefixes = (
              f"{base}/wp-content/",
              f"{base}/wp-includes/",
          )

          failures = []

          for path in root.rglob("*"):
              if (
                  not path.is_file()
                  or path.suffix.lower() not in extensions
              ):
                  continue

              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue

              for line_number, line in enumerate(
                  text.splitlines(),
                  start=1,
              ):
                  audited_line = line

                  # Mask correctly scoped GitHub Pages asset paths.
                  for prefix in valid_prefixes:
                      audited_line = audited_line.replace(
                          prefix,
                          "/__PAGES_ASSET__/",
                      )

                  if any(
                      pattern.search(audited_line)
                      for pattern in runtime_patterns
                  ):
                      failures.append(
                          (
                              path,
                              line_number,
                              line.strip(),
                          )
                      )

          if failures:
              print(
                  "ERROR: incompatible runtime asset URLs remain:"
              )

              for path, line_number, line in failures[:100]:
                  print(
                      f"{path}:{line_number}: "
                      f"{line[:300]}"
                  )

              if len(failures) > 100:
                  remaining = len(failures) - 100
                  print(
                      f"... and {remaining} additional matches."
                  )

              raise SystemExit(1)

          print("Runtime path audit OK.")
          print(
              "All runtime WordPress asset URLs are "
              "compatible with the GitHub Pages base path."
          )
          PY

      # ------------------------------------------------------------
      # 5. Upload verified Pages artifact
      # ------------------------------------------------------------
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ------------------------------------------------------------
      # 6. Deploy verified artifact
      # ------------------------------------------------------------
      # This job cannot run unless the build and runtime-path
      # verification complete successfully.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
