name: Deploy Light Color to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build GitHub Pages artifact
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      # main remains the canonical static source.
      # No GitHub Pages-specific paths are written back to the repo.
      - name: Checkout canonical static site
        uses: actions/checkout@v6

      # ------------------------------------------------------------
      # 2. Configure GitHub Pages
      # ------------------------------------------------------------
      # Provides the Pages base path dynamically.
      #
      # Current project deployment:
      #   /light-color-web
      #
      # Future custom-domain deployment may use:
      #   /
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      # ------------------------------------------------------------
      # 3. Create ephemeral deployment artifact
      # ------------------------------------------------------------
      # Copies the canonical site into _site/ and adapts only that
      # temporary copy for the GitHub Project Pages base path.
      - name: Create deployment artifact
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail

          mkdir _site

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            ./ _site/

          python3 <<'PY'
          import os
          from pathlib import Path

          root = Path("_site")
          base = os.environ["BASE_PATH"].rstrip("/")

          if not base:
              print(
                  "Pages is hosted at domain root; "
                  "no path transformation required."
              )
              raise SystemExit(0)

          extensions = {
              ".html",
              ".css",
              ".js",
              ".json",
              ".xml",
              ".xsl",
              ".svg",
          }

          replacements = {
              # ----------------------------------------------------
              # HTML / JSON / JavaScript quoted URLs
              # ----------------------------------------------------
              '"/wp-content/':
                  f'"{base}/wp-content/',
              "'/wp-content/":
                  f"'{base}/wp-content/",
              '"/wp-includes/':
                  f'"{base}/wp-includes/',
              "'/wp-includes/":
                  f"'{base}/wp-includes/",

              # ----------------------------------------------------
              # Responsive image candidates inside srcset
              #
              # Example:
              #   ..., /wp-content/image-300x300.png 300w
              # ----------------------------------------------------
              ', /wp-content/':
                  f', {base}/wp-content/',
              ', /wp-includes/':
                  f', {base}/wp-includes/',

              # ----------------------------------------------------
              # CSS url(...) references
              # ----------------------------------------------------
              'url(/wp-content/':
                  f'url({base}/wp-content/',
              'url("/wp-content/':
                  f'url("{base}/wp-content/',
              "url('/wp-content/":
                  f"url('{base}/wp-content/",

              'url(/wp-includes/':
                  f'url({base}/wp-includes/',
              'url("/wp-includes/':
                  f'url("{base}/wp-includes/',
              "url('/wp-includes/":
                  f"url('{base}/wp-includes/",
          }

          changed = []

          for path in root.rglob("*"):
              if (
                  not path.is_file()
                  or path.suffix.lower() not in extensions
              ):
                  continue

              try:
                  original = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue

              updated = original

              for old, new in replacements.items():
                  updated = updated.replace(old, new)

              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          print(f"Pages base path: {base}")
          print(f"Files adapted: {len(changed)}")

          for path in changed:
              print(f"  {path}")
          PY

      # ------------------------------------------------------------
      # 4. Verify deployment artifact
      # ------------------------------------------------------------
      # Fails before deployment if:
      #
      # - required static structure is missing; or
      # - runtime URLs still point to host-root WordPress assets
      #   while Pages is hosted below a project base path.
      #
      # Comments and sourceURL/debug references are intentionally
      # ignored because they do not represent browser asset requests.
      - name: Verify deployment artifact
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail

          test -f _site/index.html
          test -d _site/wp-content
          test -d _site/wp-includes

          echo "Artifact structure OK"
          echo "GitHub Pages base path: $BASE_PATH"

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path("_site")
          base = os.environ["BASE_PATH"].rstrip("/")

          if not base:
              print(
                  "Domain-root deployment: "
                  "root-relative WordPress paths are valid."
              )
              raise SystemExit(0)

          extensions = {
              ".html",
              ".css",
              ".js",
              ".json",
              ".xml",
              ".xsl",
              ".svg",
          }

          # Detect only URL-shaped runtime references capable of
          # generating browser requests outside the Pages base path.
          #
          # Examples that MUST fail:
          #
          #   src="/wp-content/..."
          #   href="/wp-content/..."
          #   poster="/wp-content/..."
          #
          #   srcset="/wp-content/a.png 1024w,
          #           /wp-content/b.png 300w"
          #
          #   url(/wp-content/...)
          #
          # Examples intentionally ignored:
          #
          #   //# sourceURL=/wp-includes/...
          #
          #   comments mentioning:
          #   /wp-includes/post-template.php

          runtime_patterns = [
              # src, href and poster attributes
              re.compile(
                  r'''(?:src|href|poster)\s*=\s*["']/'''
                  r'''(?:wp-content|wp-includes)/''',
                  re.IGNORECASE,
              ),

              # First or subsequent root-relative URL in srcset
              re.compile(
                  r'''srcset\s*=\s*["'][^"']*/'''
                  r'''(?:wp-content|wp-includes)/''',
                  re.IGNORECASE,
              ),

              re.compile(
                  r'''srcset\s*=\s*["'][^"']*,\s*/'''
                  r'''(?:wp-content|wp-includes)/''',
                  re.IGNORECASE,
              ),

              # CSS url(...)
              re.compile(
                  r'''url\(\s*["']?/'''
                  r'''(?:wp-content|wp-includes)/''',
                  re.IGNORECASE,
              ),
          ]

          failures = []

          for path in root.rglob("*"):
              if (
                  not path.is_file()
                  or path.suffix.lower() not in extensions
              ):
                  continue

              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue

              for line_number, line in enumerate(
                  text.splitlines(),
                  start=1,
              ):
                  if any(
                      pattern.search(line)
                      for pattern in runtime_patterns
                  ):
                      failures.append(
                          (
                              path,
                              line_number,
                              line.strip(),
                          )
                      )

          if failures:
              print(
                  "ERROR: incompatible runtime asset URLs remain:"
              )

              for path, line_number, line in failures[:100]:
                  print(
                      f"{path}:{line_number}: "
                      f"{line[:300]}"
                  )

              if len(failures) > 100:
                  remaining = len(failures) - 100
                  print(
                      f"... and {remaining} additional matches."
                  )

              raise SystemExit(1)

          print("Runtime path audit OK.")
          print(
              "No incompatible root-relative "
              "WordPress asset URLs remain."
          )
          PY

      # ------------------------------------------------------------
      # 5. Upload verified artifact
      # ------------------------------------------------------------
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ------------------------------------------------------------
      # 6. Deploy
      # ------------------------------------------------------------
      # This job only runs after the build and runtime path audit
      # have completed successfully.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
